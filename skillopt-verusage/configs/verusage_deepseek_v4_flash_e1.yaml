model:
  backend: openai_compatible
  optimizer: deepseek-v4-flash
  target: deepseek-v4-flash
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  reasoning_effort: high

train:
  num_epochs: 1
  train_size: 40
  batch_size: 40
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 60
  failure_only: false
  max_analyst_rounds: 3

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  slow_update_gate_with_selection: true
  use_meta_skill: false
  use_skill_aware_reflection: false

evaluation:
  use_gate: true
  gate_metric: hard
  use_semantic_density: false
  sel_env_num: 20
  test_env_num: 40
  eval_test: false

env:
  name: verusage
  skill_init: skillopt-verusage/skills/initial.md
  out_root: ${SKILLOPT_VERUSAGE_OUT_ROOT}
  split_mode: split_dir
  split_dir: ${SKILLOPT_VERUSAGE_SPLIT_DIR}
  verusage_src_root: ${VERUSAGE_SRC_ROOT}
  verus_bin: ${VERUS_BIN}
  lynette_bin: ${LYNETTE_BIN}
  workers: 60
  repair_attempts: 20
  request_cap: 512
  action_output_tokens: 32768
  reasoning_output_tokens: 32768
  retry_action_output_tokens: 262144
  retry_reasoning_output_tokens: 262144
  max_action_output_tokens: 384000
  max_reasoning_output_tokens: 384000
  task_retries: 2
  request_timeout_seconds: 1800
  task_timeout_seconds: 86400
  budget_state_path: ${SKILLOPT_VERUSAGE_BUDGET_STATE}
  budget_approval_limit_usd: 20.0
  budget_prior_spend_usd: 0.758768584
  budget_optimizer_reserve_usd: 1.0
  budget_request_reserve_usd: 0.1492
