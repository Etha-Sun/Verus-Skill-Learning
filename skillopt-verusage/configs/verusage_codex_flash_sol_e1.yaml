model:
  backend: codex_exec
  optimizer: gpt-5.6-sol
  target: deepseek-v4-flash
  optimizer_backend: codex_exec
  target_backend: codex_exec
  reasoning_effort: high
  codex_exec_path: ${CODEX_CLI_BIN}
  codex_exec_sandbox: read-only
  codex_exec_profile: ""
  codex_exec_full_auto: false
  codex_exec_reasoning_effort: high
  codex_exec_use_sdk: "false"
  codex_exec_network_access: false
  codex_exec_web_search: false
  codex_exec_approval_policy: never

train:
  num_epochs: 1
  train_size: 40
  batch_size: 40
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 5
  failure_only: false
  max_analyst_rounds: 3

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  slow_update_gate_with_selection: true
  use_meta_skill: false
  use_skill_aware_reflection: false

evaluation:
  use_gate: true
  gate_metric: hard
  use_semantic_density: false
  sel_env_num: 20
  test_env_num: 40
  eval_test: false

env:
  name: verusage
  target_harness: codex_cli_bridge
  skill_init: skillopt-verusage/skills/initial.md
  out_root: ${SKILLOPT_VERUSAGE_OUT_ROOT}
  split_mode: split_dir
  split_dir: ${SKILLOPT_VERUSAGE_SPLIT_DIR}
  verus_bin: ${VERUS_BIN}
  lynette_bin: ${LYNETTE_BIN}
  codex_bridge_url: ${SKILLOPT_CODEX_BRIDGE_URL}
  codex_bridge_ledger_path: ${SKILLOPT_CODEX_BRIDGE_LEDGER}
  codex_bridge_manifest_path: ${SKILLOPT_CODEX_BRIDGE_MANIFEST}
  workers: 40
  task_retries: 2
  codex_timeout_seconds: 1200
  max_codex_timeout_seconds: 1200
  model_context_window: 262144
