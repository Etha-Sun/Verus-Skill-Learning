[project]
name = "verus-skill-learning"
version = "0.1.0"
description = "Verifier-grounded skill learning for Verus proof repair"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pyyaml>=6.0"]
trace2skill = [
  "diskcache>=5.0",
  "openai>=1.0",
  "pyyaml>=6.0",
  "requests>=2.0",
  "tqdm>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
