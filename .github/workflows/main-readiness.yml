name: Main readiness

on:
  pull_request:
  push:
    branches: [main, Vskill-0822-curated]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Prepare pinned SkillOpt checkout
        run: skillopt-verusage/scripts/bootstrap_skillopt.sh
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[test,trace2skill]"
          python -m pip install -e "skillopt-verusage/SkillOpt"
      - name: Run offline main-readiness checks
        run: scripts/check_main_ready.sh
